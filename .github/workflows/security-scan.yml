name: Security scan

# trivy config IaC misconfiguration scan -- first step of the
# workspace-level security audit (PARKED.md). Its own workflow, separate
# from checks.yml/apply.yml, so a finding on the push trigger below can
# never block an apply (apply.yml has no needs: on this job either way).
# See gha-common's own README.md for the reusable workflow's full
# details.
#
# pull_request added 2026-09-14 so this can become a required status
# check (blocking PR merges on any finding, via
# required_status_check_contexts in repo-infra's own config.yml) --
# this repo is confirmed clean (0 findings) already, so unlike the
# original dyndns/terraform-state rollout there's no open-findings
# window to wait out here.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  trivy-config:
    uses: KandlerLi/gha-common/.github/workflows/trivy-config.yml@v0.0.9
    permissions:
      contents: read
